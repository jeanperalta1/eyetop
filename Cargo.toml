[package]
name = "eyetop"
version = "0.1.0"
edition = "2024"
description = "A passive Wi-Fi and Bluetooth LE field monitor for your terminal, in the spirit of btop and FieldWatch."
license = "MIT"
readme = "README.md"
keywords = ["wifi", "bluetooth", "ble", "tui", "counter-surveillance"]
categories = ["command-line-utilities"]

[dependencies]
# Terminal user interface (ratatui re-exports crossterm for keyboard input).
ratatui = "0.30"

# Bluetooth LE scanning. On Linux it talks to BlueZ over D-Bus, on macOS to
# CoreBluetooth, on Windows to WinRT. It is async, which is why we need tokio.
btleplug = "0.13"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }
futures = "0.3"
uuid = { version = "1", features = ["serde"] }

# Reading and writing settings, signatures and reports.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Small helpers.
anyhow = "1"                                    # simple error handling
chrono = "0.4"                                  # turning timestamps into local clock times
clap = { version = "4", features = ["derive"] } # command-line options
directories = "6"                               # ~/.config/eyetop and ~/.local/share/eyetop
regex = "1"                                     # "name_regex" signature rules

[profile.release]
opt-level = 3
lto = "thin"
strip = true
