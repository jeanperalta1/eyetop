notes = "Default management hotspot name of the WiFi Pineapple."
extra_attention = "A rogue access point tool: it can impersonate networks your devices trust. Avoid joining unknown open networks nearby."
rules = [{ kind = "name_regex", value = '^Pineapple_' }]

[[signature]]
id = "deauther"
name = "ESP8266 Deauther"
class = "pentest"
