# ═══ Pentest ═════════════════════════════════════════════════════════════════

[[signature]]
id = "flipper-zero"
name = "Flipper Zero"
class = "pentest"
radio = "bluetooth"
notes = "Flipper Devices company ID (0x0E29), the default 'Flipper <name>' Bluetooth name, or the STM32WB public address range the Flipper derives its MAC from (80:E1:26/27 — other STM32WB gadgets share it)."
extra_attention = "A radio multi-tool: it can read and clone some badges, replay remote-control signals and spam Bluetooth pairing pop-ups. Usually a hobbyist, but worth noticing."
rules = [
    { kind = "ble_company", value = "0E29" },
    { kind = "name_regex", value = '^Flipper ' },
    { kind = "mac_prefix", value = "80:E1:26" },
    { kind = "mac_prefix", value = "80:E1:27" },
]

