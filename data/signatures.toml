name = "Flock Safety camera"
class = "surveillance"
notes = "Automated license plate reader (ALPR). Identifiers from community research (flock-you, DeFlock): Flock's own MAC block, its battery/camera names, and Bluetooth company 0x09C8 (XUNTONG). Names like 'Penguin' can match unrelated devices."
extra_attention = "License plate reader camera. These log every passing vehicle."
