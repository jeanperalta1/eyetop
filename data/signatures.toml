# ═══ Drones ══════════════════════════════════════════════════════════════════

[[signature]]
id = "dji"
name = "DJI drone / controller"
class = "drones"
rules = [
    { kind = "vendor", value = "DJI" },
    { kind = "ble_company", value = "08AA" },
    { kind = "name_regex", value = '(?i)^(dji|tello-|mavic|spark-)' },
]

[[signature]]
id = "parrot"
name = "Parrot drone"
class = "drones"
radio = "wifi"
notes = "Wi-Fi only: Parrot's Bluetooth company ID belongs to its car-kit business."
rules = [
    { kind = "vendor", value = "PARROT" },
    { kind = "name_regex", value = '(?i)^(bebop|anafi|disco-)' },
]

[[signature]]
id = "skydio"
name = "Skydio drone"
class = "drones"
rules = [
    { kind = "vendor", value = "Skydio" },
    { kind = "name", value = "Skydio" },
]

[[signature]]
id = "autel-yuneec"
name = "Autel / Yuneec drone"
class = "drones"
rules = [
    { kind = "name_regex", value = '(?i)^autel' },
    { kind = "vendor", value = "Yuneec" },
]

[[signature]]
id = "remote-id-ble"
name = "Drone Remote ID (Bluetooth)"
class = "drones"
radio = "bluetooth"
decoder = "remote_id"
notes = "ASTM F3411 / Open Drone ID: service data 0xFFFA with app code 0x0D. Required on most drones in the US and EU; it carries the drone's ID and position."
rules = [{ kind = "ble_service", value = "FFFA:0D" }]

[[signature]]
id = "remote-id-wifi"
name = "Drone Remote ID (Wi-Fi)"
class = "drones"
radio = "wifi"
notes = "Remote ID inside a Wi-Fi beacon (vendor element FA:0B:BC type 0x0D, or the French 6A:5C:35 format). Seen only with the iw backend."
rules = [
    { kind = "wifi_ie", value = "FA:0B:BC:0D" },
    { kind = "wifi_ie", value = "6A:5C:35:01" },
]


# ═══ Finder tags ═════════════════════════════════════════════════════════════

[[signature]]
id = "apple-find-my-separated"
name = "Apple Find My (separated)"
class = "finder_tags"
radio = "bluetooth"
decoder = "apple_find_my"
notes = "Find My offline-finding advert with the full public key (type 0x12, length 0x19): an AirTag or Find My accessory that has been away from its owner for a while. Its key and address change once a day."
extra_attention = "A tracker away from its owner. If it keeps showing up as you move (see 'Moving with you'), check your bag, car and clothes. iPhones and Android phones can scan for it and play a sound."
rules = [{ kind = "ble_company", value = "004C:12 19" }]

[[signature]]
id = "apple-find-my-nearby"
name = "Apple Find My (near owner)"
class = "finder_tags"
radio = "bluetooth"
decoder = "apple_find_my"
notes = "Short Find My advert (type 0x12, length 0x02): the owner's iPhone was seen in the last ~15 minutes. Normal in public places."
rules = [{ kind = "ble_company", value = "004C:12 02" }]

[[signature]]
id = "tile"
name = "Tile tracker"
class = "finder_tags"
radio = "bluetooth"
rules = [
    { kind = "ble_service", value = "FEED" },
    { kind = "ble_service", value = "FEEC" },
    { kind = "ble_company", value = "067C" },
]

[[signature]]
id = "samsung-smarttag"
name = "Samsung SmartTag"
class = "finder_tags"
radio = "bluetooth"
notes = "0xFD5A is SmartThings Find (registered tags), 0xFD59 is used while a tag is being set up."
rules = [
    { kind = "ble_service", value = "FD5A" },
    { kind = "ble_service", value = "FD59" },
]

[[signature]]
id = "chipolo"
name = "Chipolo tracker"
class = "finder_tags"
radio = "bluetooth"
rules = [
    { kind = "ble_service", value = "FE33" },
    { kind = "ble_company", value = "08C3" },
]

[[signature]]
id = "google-find-hub"
name = "Google Find Hub tag"
class = "finder_tags"
radio = "bluetooth"
notes = "Find Hub (formerly Find My Device) network accessory: Eddystone service 0xFEAA, frame type 0x40."
rules = [{ kind = "ble_service", value = "FEAA:40" }]

[[signature]]
id = "google-find-hub-separated"
name = "Google Find Hub tag (separated)"
class = "finder_tags"
radio = "bluetooth"
notes = "Frame type 0x41 means 'unwanted tracking protection mode': the tag has been away from its owner."
extra_attention = "A tracker in unwanted-tracking mode. If it travels with you, look for it and consider an Android 'Unknown tracker' scan."
rules = [{ kind = "ble_service", value = "FEAA:41" }]


# ═══ Glasses ═════════════════════════════════════════════════════════════════

[[signature]]
id = "meta-glasses"
name = "Meta / Ray-Ban glasses"
class = "glasses"
radio = "bluetooth"
notes = "Meta Platforms (0x01AB, 0x058E) and Luxottica (0x0D53) company IDs, as used by the Nearby Glasses project. Meta Quest headsets share these IDs, so false positives happen."
extra_attention = "Camera glasses can take photos and video. Look for someone wearing glasses with a small light near the hinge."
