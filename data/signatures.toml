name = "HID access reader / credential"
class = "access_control"
radio = "bluetooth"
notes = "HID Global makes door badge readers and phone-based access credentials (HID Mobile Access)."
rules = [{ kind = "ble_company", value = "0124" }]

[[signature]]
id = "assa-abloy"
name = "ASSA ABLOY / Yale lock"
class = "access_control"
radio = "bluetooth"
notes = "ASSA ABLOY group locks and readers (Yale, Aperio and others)."
rules = [{ kind = "ble_company", value = "012E" }]

[[signature]]
