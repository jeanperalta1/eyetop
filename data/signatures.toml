rules = [{ kind = "name_regex", value = '^pwned$' }]

[[signature]]
id = "pwnagotchi"
name = "Pwnagotchi"
class = "pentest"
radio = "wifi"
notes = "Pwnagotchi beacons come from the fixed address DE:AD:BE:EF:DE:AD."
extra_attention = "Collects Wi-Fi handshakes for offline password cracking."
rules = [{ kind = "mac_prefix", value = "DE:AD:BE:EF:DE:AD" }]

[[signature]]
id = "marauder"
name = "ESP32 Marauder"
class = "pentest"
radio = "wifi"
extra_attention = "Wi-Fi/Bluetooth attack firmware for ESP32 boards."
rules = [{ kind = "name_regex", value = '(?i)marauder' }]

[[signature]]
id = "omg-cable"
name = "O.MG cable"
class = "pentest"
radio = "wifi"
notes = "Default hotspot of the O.MG cable, a USB cable with a hidden implant."
