name = "Schlage / Allegion lock"
class = "access_control"
radio = "bluetooth"
notes = "Allegion makes Schlage smart locks and commercial access hardware."
rules = [{ kind = "ble_company", value = "013B" }]

[[signature]]
id = "august-lock"
name = "August smart lock"
class = "access_control"
radio = "bluetooth"
rules = [{ kind = "ble_company", value = "01D1" }]

[[signature]]
